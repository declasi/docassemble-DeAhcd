  # Set the allowed courts for this interview
  user_role = "plaintiff"
  user_ask_role = "plaintiff"
  nav.set_section("client_info")
  users.gather()
  nav.set_section("agents_and_alternates")
  agents[0].name.first
  agents[1].name.first
  alternate_agents[0].name.first
  alternate_agents[1].name.first
  set_progress(16)
  agents_authority
  nav.set_section("health_preferences")
  users_priorities
  nav.set_section("guardians_and_witnesses")
  witnesses.gather()
  guardians.gather()
  alternate_agents[1].email
  nav.set_section("agents_and_alternates")
  guardians.address.address
