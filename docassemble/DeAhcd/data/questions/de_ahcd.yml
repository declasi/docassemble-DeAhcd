---
id: DE_AHCD
continue button field: de_ahcd_intro
question: |
  DE AHCD
subquestion: |
  This interview will help you create an Advance Health Care Directive in Delaware.
  
  Before you get started, please gather:
  
  1. Names and contact information of agents
  2. 
  1. 
  
  When you are finished, you will need to:
  
  1. Download the document to review with the client
  2. Send to an attorney for review

---
################ CLIENT INFO ############################
code: | 
  users.name.first
  users.address.address
  users.complete=True
---
id: Client Information
sets: 
  - users.name.first
  - users.name.last
  - users.name.middle
  - users.name.suffix
question: |
  Client Identification
subquestion: |
  Please provide the client's name, date of birth and contact information.
fields:
  - code: |
      users.name_fields()
  - "User date of birth": users.birthdate
    datatype: BirthDate
  - Street address: users.address.address
    address autocomplete: True
  - Address line 2: users.address.unit
    required: False
  - City: users.address.city
  - State: users.address.state
    code: |
      states_list() 
  - ZIP code: users.address.zip
  - "Client phone number": users.phone_number
    datatype: al_international_phone
    required: false
  - "Client email": users.email
    required: false
---
################################## PART A NAMING AGENTS AND ALTERNATE AGENTS #####################
####################### AGENTS INFO ##########################
code: | 
  agents[i].name.first
  agents[i].address.address
  agents[i].complete=True
---
code: |
  if agents.number_gathered() == 2:
    agents.there_is_another = False
---
id: Naming the Clients Agents
sets:
  - agents[i].name.first
  - agents[i].name.last
  - agents[i].name.middle
  - agents[i].name.suffix

question: |
  Naming the Client's Agent(s)
subquestion: |
  List the person(s) the client wants to make health care decisions for them.
fields:
  - code: |
      agents[i].name_fields()
  - "Agent date of birth": agents[i].birthdate
    datatype: BirthDate
    required: false
  - "Agent relationship": agents[i].relationship
---
id: Agents Contact Information
sets: 
  - agents[i].address.address
question: |
  Agent's contact information
subquestion: |
  Provide ${ agents[i].name.first } contact details:
fields:
  - Street address: agents[i].address.address
    address autocomplete: True
  - Address line 2: agents[i].address.unit
    required: False
  - City: agents[i].address.city
  - State: agents[i].address.state
    code: |
      states_list() 
  - ZIP code: agents[i].address.zip
  - "Agent phone number": agents[i].phone_number
    datatype: al_international_phone
  - "Agent email": agents[i].email
    required: false

---
id: Agents cooperate
question: |
  Select how you want your agents to work together
field: agents_independent
choices:
  - "Each of my agents can act independently, with or without consulting each other.": True
  - "My agents must come to an agreement and make decisions together.": False
---
################### ALTERNATE AGENT INFO #####################
id: Alternate agents
question: |
  Does the client want to name an alternate agent(s)?
yesno: designate_alternate_agents
---
code: | 
  alternate_agents[i].name.first
  alternate_agents[i].address.address
  alternate_agents[i].complete=True
---
code: |
  if alternate_agents.number_gathered() == 2:
    alternate_agents.there_is_another = False
---
id: Naming the Clients Alternate Agents
sets:
  - alternate_agents[i].name.first
  - alternate_agents[i].name.last
  - alternate_agents[i].name.middle
  - alternate_agents[i].name.suffix

question: |
  Naming the Client's Alternate Agent(s)
subquestion: |
  List the person(s) the client wants to make health care decisions for them if their agent(s) are unavailable, unwilling, or unable to act.
fields:
  - code: |
      alternate_agents[i].name_fields()
  - "Alternate Agent date of birth": alternate_agents[i].birthdate
    datatype: BirthDate
    required: false
  - "Alternate Agent relationship": alternate_agents[i].relationship
---
id: Alternate Agents Contact Information
sets: 
  - alternate_agents[i].address.address
question: |
  Alternate Agent's contact information
subquestion: |
  Provide ${ alternate_agents[i].name.first } contact details:
fields:
  - Street address: alternate_agents[i].address.address
    address autocomplete: True
  - Address line 2: alternate_agents[i].address.unit
    required: False
  - City: alternate_agents[i].address.city
  - State: alternate_agents[i].address.state
    code: |
      states_list() 
  - ZIP code: alternate_agents[i].address.zip
  - "Agent phone number": alternate_agents[i].phone_number
    datatype: al_international_phone
  - "Agent email": alternate_agents[i].email
    required: false   
---
id: Alternate Agents cooperate
question: |
  Select how you want your alternate agents to work together
field: alternate_agents_independent
choices:
  - "Each of my alternate agents can act independently, with or without consulting each other.": True
  - "My alternate agents must come to an agreement and make decisions together.": False

---
###################### PART B AGENT'S AUTHORITY ###############################
id: Agents Authority Health Info
question: |
  Select when the agent(s) can acccess health care information
field: health_info_incapacitated
choices:
  - "I give my agent permission to obtain, examine, and share information about my health needs and health care only when I cannot make decisions for myself, and not at any other time.": True
  - "I give my agent permission to obtain, examine, and share information about my health needs and health care at any time, including both when I can and cannot make decisions for myself, as long as my agent thinks it will help me.": False
---
id: Agents Authority Nursing Home
question: |
  Select when the agent(s) can place the client in a nursing home
field: nursing_home
choices:
  - "My agent may place me in a nursing home for more than 100 days, even if: I object, I am not terminally ill, or my needs can be met somewhere else.": True
  - "My agent may NOT place me in a nursing home for more than 100 days if: I object, I am not terminally ill, or my needs can be met somewhere else.": False
---
id: Agents Authority Phychiatric Facility
question: |
  Select whether the agent(s) can place the client in a psychiatric facility
field: psychiatric_facility
choices:
  - "My agent may admit me as a voluntary patient to a facility for mental health treatment for the shorter of 72 hours or the number of hours specified here:": True
  - "My agent may NOT admit me as a voluntary patient to a facility for mental health treatment.": False
---
id: Hours at psychiatric facility
question: |
   Specify the number of hours the client can be placed in a psychiatric facility
fields: 
  - Hours in psychiatric facility: hours_psychiatric_facility
    datatype: integer
---
id: Agents Authority Other
question: |
  Other Limitations on Agent’s Authority
fields:
  - "Describe other limitations the client would like to place on their agent's authority": agents_authority
    datatype: area
    rows: 2
    required: false
---
######################## Part C Health Care Information Section ########################
####### TREATMENT ####################
id: Treatment
question: |
  Treatment 
subquestion: |
  Medical treatment needed to keep me alive, but not needed for comfort or any other purpose (for example: mechanical respiration, dialysis, surgery, blood transfusion, chemotherapy/radiation treatment), should… (mark all that apply):
fields: 
  - "Always be given to me. (If you mark this choice, you should not mark other choices in this “treatment” section).": medical_treatment_always
    datatype: yesnowide
  - note: |
      **If you mark this choice, you should NOT mark other choices in this “treatment” section**
    show if: medical_treatment_always
  - "Not be given to me if I have a terminal illness (a condition that is not curable and is expected to cause my death soon, even if treated).": medical_treatment_terminal_illness
    datatype: yesnowide
  - "Not be given to me if I am permanently unconscious (unconscious and I am not expected to be conscious again).": medical_treatment_permanently_unconcious
    datatype: yesnowide
  - "Not be given to me if I have a medical condition from which I am not expected to recover that prevents me from communicating with people I care about and recognizing family and friends.": medical_treatment_no_recovery 
    datatype: yesnowide
  - "Other (write what you want or do not want)": medical_treatment_other
    datatype: yesnowide
  - "Describe other treatment": medical_treatment_instructions
    datatype: area
    rows: 2
    show if: medical_treatment_other
validation code: |
  if medical_treatment_always and (medical_treatment_terminal_illness or medical_treatment_permanently_unconcious or medical_treatment_no_recovery or medical_treatment_other):
    validation_error("You cannot mark other choices in this Treatment section.")
---
########## FOOD AND LIQUIDS ####################
id: Food and liquids
question: |
  Food and Liquids 
subquestion: |
  If I can’t swallow and staying alive requires me to get food or liquids through a tube or other means for the rest of my life, then food or liquids should… (mark all that apply):
fields: 
  - "Always be given to me. (If you mark this choice, you should not mark other choices in this “treatment” section).": food_always
    datatype: yesnowide
  - note: |
      **If you mark this choice, you should NOT mark other choices in this “food and liquids” section**
    show if: food_always
  - "Not be given to me if I have a terminal illness (a condition that is not curable and is expected to cause my death soon, even if treated).": food_terminal_illness
    datatype: yesnowide
  - "Not be given to me if I am permanently unconscious (unconscious and I am not expected to be conscious again).": food_permanently_unconcious
    datatype: yesnowide
  - "Not be given to me if I have a medical condition from which I am not expected to recover that prevents me from communicating with people I care about and recognizing family and friends.": food_no_recovery 
    datatype: yesnowide
  - "Other (write what you want or do not want)": food_other
    datatype: yesnowide
  - "Describe other treatment": food_instructions
    datatype: area
    rows: 2
    show if: food_other
validation code: |
  if food_always and (food_terminal_illness or food_permanently_unconcious or food_no_recovery or food_other):
    validation_error("You cannot mark other choices in this Food and Liquids section.")
---
########## PAIN RELIEF ####################
id: Pain Relief
question: |
  Pain Relief 
subquestion: |
  If I am in significant pain, care that will keep me comfortable but is likely to shorten my life should… (mark all that apply):
fields: 
  - "Always be given to me. (If you mark this choice, you should not mark other choices in this “Pain Relief” section).": pain_relief_always
    datatype: yesnowide
  - note: |
      **If you mark this choice, you should NOT mark other choices in this “Pain Relief” section**
    show if: pain_relief_always
  - "Never be given to me. (If you mark this choice, you should not mark other choices in this “Pain Relief” section).": pain_relief_never
    datatype: yesnowide
  - note: |
      **If you mark this choice, you should NOT mark other choices in this “Pain Relief” section**
    show if: pain_relief_never
  - "Be given to me if I have a terminal illness (a condition that is not curable and is expected to cause my death soon, even if treated).": pain_relief_terminal_illness
    datatype: yesnowide
  - "Be given to me if I am permanently unconscious (unconscious and I am not expected to be conscious again).": pain_relief_permanently_unconcious
    datatype: yesnowide
  - "Be given to me if I have a medical condition from which I am not expected to recover that prevents me from communicating with people I care about and recognizing family and friends.": pain_relief_no_recovery 
    datatype: yesnowide
  - "Other (write what you want or do not want)": pain_relief_other
    datatype: yesnowide
  - "Describe other treatment": pain_relief_instructions
    datatype: area
    rows: 2
    show if: pain_relief_other
validation code: |
  if pain_relief_always and (pain_relief_never or pain_relief_terminal_illness or pain_relief_permanently_unconcious or pain_relief_no_recovery or pain_relief_other) or pain_relief_never and (pain_relief_always or pain_relief_terminal_illness or pain_relief_permanently_unconcious or pain_relief_no_recovery or pain_relief_other):
    validation_error("You cannot mark other choices in this Pain Relief section.")
---
################ HEALTH CARE PRIORITIES ####################
id: Health Care Priorities
question: |
  Health Care Priorities
subquestion: |
  You can use this section to indicate what is important to you, and what is not important to you. This information can help your agent make decisions for you if you cannot. It also helps others understand your preferences. For example, you could include more information about your goals, values, and preferences for treatment, including care you want or do not want. You can also use this section to name anyone who you do NOT want to make decisions for you under any conditions.
fields:
  - "User health care priorities": users_priorities
    datatype: area
    rows: 4
  - "Body parts not to donate": body_parts_not_donate
---
############## PART E: OTHER GUIDANCE ###########################
id: Flexibility for Agent
question: |
  Flexibility for My Agent
subquestion: |
  Select one (1) of the following options
field: specific_instructions
choices:
  - "My agent must follow the instructions in this document, even if my agent thinks something else would be better for me.": True 
  - "I give my agent permission to be flexible in applying these instructions if my agent thinks it would be in my best interest based on what my agent knows about me.": False
---
id: Flexible Instructions Narrative
question: |
  This flexibility does not apply to the following
fields:
  - Instructions: flexible_instructions_narrative
    datatype: area
    rows: 2

---
