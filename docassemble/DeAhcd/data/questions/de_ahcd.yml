---
# ALDocument objects specify the metadata for each template
objects:
  - de_ahcd_Post_interview_instructions: ALDocument.using(title="Instructions", filename="de_ahcd_next_steps.docx", enabled=True, has_addendum=False)
  - de_ahcd_attachment: ALDocument.using(title="DE AHCD", filename="de_ahcd", enabled=True, has_addendum=False, )
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[de_ahcd_Post_interview_instructions, de_ahcd_attachment], filename="de_ahcd", title="All forms to download for your records", enabled=True)
  - al_recipient_bundle: ALDocumentBundle.using(elements=[de_ahcd_attachment],  filename="de_ahcd", title="All forms to file", enabled=True)
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the same template is 
# used for "preview" and "final" keys, and logic in the template checks the value of 
# `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: de_ahcd_next_steps
  docx template file: de_ahcd_next_steps.docx
  variable name: de_ahcd_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
---
attachment:
  name: de ahcd
  filename: de_ahcd
  variable name: de_ahcd_attachment[i]
  skip undefined: True
  docx template file: de_ahcd.docx
  tagged pdf: True



