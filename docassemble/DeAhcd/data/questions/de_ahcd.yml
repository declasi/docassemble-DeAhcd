---
comment: |
  Controls order and branching logic for questions specific to this form
id: interview_order_de_ahcd
code: |
  # Set the allowed courts for this interview
  user_role = "plaintiff"
  user_ask_role = "plaintiff"
  nav.set_section("client_info")
  users.name.first
  nav.set_section("agents_and_alternates")
  agents.gather()
  if agents.number_gathered() > 1:
    agents_independent
  designate_alternate_agents
  if designate_alternate_agents == True:
    alternate_agents.gather()
  if alternate_agents.number_gathered() > 1:
    alternate_agents_independent
  set_progress(16)
  nav.set_section("agents_authority")
  health_info_incapacitated
  nursing_home
  psychiatric_facility
  if psychiatric_facility == True:
    hours_psychiatric_facility  
  agents_authority
  nav.set_section("health_care_instructions")
  medical_treatment_always
  food_always
  pain_relief_always
  nav.set_section("user_priorities")
  users_priorities
  nav.set_section("other_guidance")
  specific_instructions
  flexible_instructions_narrative
  nav.set_section("guardians_and_witnesses")
  witness.name.first
  if ask_guardian: 
    guardian.name.first
    guardian.address.address
    guardian.phone_number
  set_progress(32)
  exclude_surrogates[1].name.first
  exclude_surrogates[0].name.first
  set_progress(48)
  nav.set_section("health_preferences")
  other_default_surrogate
  default_surrogate.name
  set_progress(64)
  exclude_surrogates[2].name.first
  interview_order_de_ahcd = True
